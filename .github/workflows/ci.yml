name: CI

on:
  push:
  pull_request:

jobs:
  python:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.9", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - run: pip install -e '.[dev]'
      - run: ruff check .
      - run: ruff format --check .
      - run: pytest -q

  ghidra-integration:
    runs-on: ubuntu-latest
    env:
      GHIDRA_URL: https://github.com/NationalSecurityAgency/ghidra/releases/download/Ghidra_12.1.3_build/ghidra_12.1.3_PUBLIC_20260817.zip
      GHIDRA_INSTALL_DIR: ${{ github.workspace }}/.ghidra/ghidra_12.1.3_PUBLIC
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/cache@v4
        with:
          path: .ghidra
          key: ghidra-12.1.3
      - name: Download Ghidra
        run: |
          if [ ! -d "$GHIDRA_INSTALL_DIR" ]; then
            mkdir -p .ghidra && curl -sSL -o ghidra.zip "$GHIDRA_URL"
            unzip -q ghidra.zip -d .ghidra && rm ghidra.zip
          fi
      - run: pip install -e .
      - name: Compile Ghidra scripts
        run: |
          javac -d "$RUNNER_TEMP/classes" \
            -cp "$(find "$GHIDRA_INSTALL_DIR/Ghidra" -name '*.jar' | tr '\n' :)" ghidra_scripts/*.java
      - name: End-to-end pipeline
        run: tests/integration/run.sh "$RUNNER_TEMP/integration"
