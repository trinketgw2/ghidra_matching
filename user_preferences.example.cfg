# ghidra_matching preferences.
#
# Copy this file to user_preferences.cfg (same folder) and fill in your values. That copy is
# ignored by git, so your paths stay on your machine. To keep it elsewhere, point the
# GHIDRA_MATCHING_CONFIG environment variable at it.
#
# One KEY=VALUE per line, no spaces around "=", no quotes. Lines starting with # are ignored.
# Relative paths are relative to the repository folder.
# Read by scripts\windows\*.bat and by `ghidra-match update`; environment variables with the
# same names, and command line options, take precedence.

# Ghidra installation (the folder that contains support\analyzeHeadless.bat)
GHIDRA_INSTALL_DIR=C:\path\to\ghidra_12.1.3_PUBLIC

# Folder that contains <project>.gpr
GHIDRA_PROJECT_DIR=C:\path\to\ghidra_projects

# Optional: project name and the program's name inside each build folder. With both set,
# a build is given by its folder alone (v1.1 = MyProject:/v1.1/program.exe);
# otherwise give the full path, MyProject/v1.1/program.exe.
GHIDRA_PROJECT_NAME=MyProject
PROGRAM_NAME=program.exe

# Where exports are written and read, and where pairing tables, reports and logs go
EXPORT_DIR=exports
OUT_DIR=out

# Folder name for a new build created by `update --new` without --name.
# Fields: {year} {month} (1-12) {mon} (Jan-Dec) {day}; format specs work, e.g. {month:02d}.
BUILD_NAME_FORMAT={year}-{month:02d}-{day:02d}

# Extra ApplyMatchTable options always passed by apply.bat, space separated key=value,
# e.g. APPLY_OPTIONS=min_confidence=0.5 replace_signatures=false
APPLY_OPTIONS=
